services:
  discuz-web:
    # 自己本地构建discuz镜像
    build:
      context: .
      args:
        - DISCUZ_URL=https://download.discuz.vip/redirect/?X5.0
    # 或使用预构建镜像
    # image: izumiko/discuz:latest
    container_name: discuz-app
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SERVER_NAME=:80
      - PUID=1000  # 填入你宿主机用户的 UID (终端输入 id -u 查看)
      - PGID=1000  # 填入你宿主机用户的 GID (终端输入 id -g 查看)
    volumes:
      - ./www:/app/public
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - discuz-db

  # discuz-db:
  #   image: mysql:8
  #   container_name: discuz-db
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: discuz
  #     MYSQL_USER: discuz
  #     MYSQL_PASSWORD: discuzpassword
  #   volumes:
  #     - db_data:/var/lib/mysql

  discuz-db:
    image: mariadb:10
    container_name: discuz-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: discuz
      MARIADB_USER: discuz
      MARIADB_PASSWORD: discuzpassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  caddy_data:
  caddy_config:
