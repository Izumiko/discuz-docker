name: Nightly Build for X5.0

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest commit on Gitee
        id: check
        run: |
          # 1. 调用 Gitee API 获取 MitFrame 分支的最新 commit SHA
          API_URL="https://gitee.com/api/v5/repos/Discuz/DiscuzX/commits?sha=MitFrame&per_page=1"
          LATEST_SHA=$(curl -s $API_URL | jq -r '.[0].sha')

          if [ "$LATEST_SHA" == "null" ] || [ -z "$LATEST_SHA" ]; then
            echo "Error: Failed to fetch commit SHA from Gitee."
            exit 1
          fi

          SHORT_SHA=${LATEST_SHA:0:7}
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 2. 使用 skopeo 远程读取 Docker Hub 上 nightly 镜像的 Label
          # 如果是首次运行（镜像不存在），命令会报错，我们用 || echo "none" 兜底处理
          CURRENT_SHA=$(skopeo inspect docker://docker.io/izumiko/discuz:nightly 2>/dev/null | jq -r '.Labels["org.opencontainers.image.revision"] // "none"' || echo "none")

          echo "Gitee Latest SHA: $SHORT_SHA"
          echo "Docker Hub Current SHA: $CURRENT_SHA"

          # 3. 对比判断是否需要构建
          if [ "$CURRENT_SHA" == "$SHORT_SHA" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image is already up-to-date. Skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New commit found. Proceeding with build."
          fi

      - name: Checkout repository
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Nightly Docker image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile-nightly
          platforms: linux/amd64,linux/arm64
          push: true
          tags: izumiko/discuz:nightly
          labels: |
            org.opencontainers.image.revision=${{ steps.check.outputs.sha }}

      - name: Build and push Nightly Alpine Docker image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile-alpine-nightly
          platforms: linux/amd64,linux/arm64
          push: true
          tags: izumiko/discuz:nightly-alpine
          labels: |
            org.opencontainers.image.revision=${{ steps.check.outputs.sha }}
